{% extends "base.html" %}{% block content %}<div class="admin-layout"><aside class="sidebar">{% include "_adminnav.html" %}</aside><section class="admin-main"><div class="page-head"><h2>Booking Management</h2></div><div class="panel table-wrap"><table><tr><th>Guest</th><th>Date</th><th>Time</th><th>Guests</th><th>Table</th><th>Status</th><th>Update</th></tr>{% for b in bookings %}<tr><td>{{b.customer_name}}<br><small>{{b.phone}}</small></td><td>{{b.booking_date}}</td><td>{{b.booking_time}}</td><td>{{b.guests}}</td><td>{{b.table_no or "—"}}</td><td>{{b.status}}</td><td><form method="post" class="inline"><input type="hidden" name="booking_id" value="{{b.id}}"><input name="table_no" value="{{b.table_no or ''}}" placeholder="T-01"><select name="status"><option>Booked</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select><button class="small-btn">Save</button></form></td></tr>{% endfor %}</table></div></section></div>{% endblock %}
