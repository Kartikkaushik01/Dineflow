{% extends "base.html" %}{% block content %}<div class="admin-layout"><aside class="sidebar">{% include "_adminnav.html" %}</aside><section class="admin-main"><div class="page-head"><h2>Menu Management</h2></div><div class="panel"><h3>Add Menu Item</h3><form method="post" class="form-grid"><input type="hidden" name="action" value="add"><input name="name" placeholder="Dish name" required><input name="category" placeholder="Category" required><input name="price" type="number" step=".01" placeholder="Price" required><input name="description" placeholder="Description"><button class="btn">Add Item</button></form></div><div class="panel table-wrap"><table><tr><th>Dish</th><th>Category</th><th>Price</th><th>Availability</th><th>Action</th></tr>{% for x in menu %}<tr><td>{{x.name}}</td><td>{{x.category}}</td><td>₹{{x.price}}</td><td>{{"Available" if x.available else "Hidden"}}</td><td><form method="post" class="inline"><input type="hidden" name="action" value="toggle"><input type="hidden" name="id" value="{{x.id}}"><button class="small-btn">Toggle</button></form></td></tr>{% endfor %}</table></div></section></div>{% endblock %}
