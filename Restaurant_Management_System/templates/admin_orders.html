{% extends "base.html" %}{% block content %}<div class="admin-layout"><aside class="sidebar">{% include "_adminnav.html" %}</aside><section class="admin-main"><div class="page-head"><h2>Order Management</h2></div><div class="panel table-wrap"><table><tr><th>ID</th><th>Customer</th><th>Type</th><th>Total</th><th>Status</th><th>Payment</th><th>Update</th></tr>{% for o in orders %}<tr><td>#{{o.id}}</td><td>{{o.customer_name}}</td><td>{{o.order_type}}</td><td>₹{{"%.2f"|format(o.total)}}</td><td><span class="status">{{o.status}}</span></td><td>{{o.payment_status}}</td><td><form method="post" class="inline"><input type="hidden" name="order_id" value="{{o.id}}"><select name="status"><option {% if o.status=="Pending"%}selected{%endif%}>Pending</option><option {% if o.status=="Confirmed"%}selected{%endif%}>Confirmed</option><option {% if o.status=="Preparing"%}selected{%endif%}>Preparing</option><option {% if o.status=="Ready"%}selected{%endif%}>Ready</option><option {% if o.status=="Delivered"%}selected{%endif%}>Delivered</option><option {% if o.status=="Cancelled"%}selected{%endif%}>Cancelled</option></select><select name="payment_status"><option {% if o.payment_status=="Pending"%}selected{%endif%}>Pending</option><option {% if o.payment_status=="Paid"%}selected{%endif%}>Paid</option></select><button class="small-btn">Save</button></form></td></tr>{% endfor %}</table></div></section></div>{% endblock %}
