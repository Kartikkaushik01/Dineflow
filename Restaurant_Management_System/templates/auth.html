{% extends "base.html" %}{% block content %}
<div class="auth-wrap"><div class="auth-card"><span class="eyebrow">DINEFLOW ACCOUNT</span>
<h2>{{"Create your account" if mode=="register" else "Welcome back"}}</h2>
<form method="post">
{% if mode=="register" %}<label>Name<input name="name" required></label>{% endif %}
<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="6" required></label>
<button class="btn" type="submit">{{"Register" if mode=="register" else "Login"}}</button>
</form>
<p>{% if mode=="register" %}Already have an account? <a href="{{url_for('login')}}">Login</a>{% else %}New customer? <a href="{{url_for('register')}}">Create account</a>{% endif %}</p>
</div></div>{% endblock %}
