{% extends "base.html" %}{% block content %}<section class="page-head"><div><span class="eyebrow">RESERVATIONS</span><h2>Table Bookings</h2></div></section>
<div class="checkout-grid"><div class="panel"><h3>Book a table</h3><label>Phone<input id="b-phone" required></label><div class="two"><label>Date<input type="date" id="b-date" required></label><label>Time<input type="time" id="b-time" required></label></div><label>Guests<input type="number" id="b-guests" min="1" max="20" value="2"></label><button class="btn full" onclick="bookTable()">Confirm Booking</button></div>
<div class="panel"><h3>Your bookings</h3>{% for b in bookings %}<div class="order-row"><div><b>{{b.booking_date}} • {{b.booking_time}}</b><small>{{b.guests}} guests • Table {{b.table_no or "Pending"}}</small></div><span class="status">{{b.status}}</span></div>{% else %}<p>No bookings.</p>{% endfor %}</div></div>{% endblock %}
