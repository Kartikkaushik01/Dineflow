{% extends "base.html" %}{% block content %}<div class="admin-layout"><aside class="sidebar">{% include "_adminnav.html" %}</aside><section class="admin-main"><div class="page-head"><h2>Customer Analytics</h2></div><div class="panel table-wrap"><table><tr><th>Customer</th><th>Email</th><th>Orders</th><th>Total Spend</th><th>Joined</th></tr>{% for c in customers %}<tr><td>{{c.name}}</td><td>{{c.email}}</td><td>{{c.orders}}</td><td>₹{{"%.2f"|format(c.spend)}}</td><td>{{c.created_at[:10]}}</td></tr>{% endfor %}</table></div></section></div>{% endblock %}
